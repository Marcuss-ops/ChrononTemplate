name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Configure, build and test (headless standalone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ChrononTemplate
        uses: actions/checkout@v4
        with:
          path: ChrononTemplate

      - name: Checkout ChrononMotion3D (sibling core)
        uses: actions/checkout@v4
        with:
          repository: Marcuss-ops/ChrononMotion3d
          path: ChrononMotion3D

      - name: Checkout Chronon3D (headers required by template adapter)
        uses: actions/checkout@v4
        with:
          repository: Marcuss-ops/Chronon3d
          path: Chronon3d

      - name: Install build deps
        run: |
          sudo apt-get update
          # Header closure of the headless build (verified by include scan):
          # GLM + fmt + flat magic_enum (bridged by CMake) + xxhash +
          # meshoptimizer, all reached transitively via Chronon3D headers.
          sudo apt-get install -y cmake g++ ninja-build nlohmann-json3-dev python3 libglm-dev libfmt-dev libmagicenum-dev libxxhash-dev libmeshoptimizer-dev

      - name: Configure (headless, no live Chronon3D adapter)
        run: |
          cmake -S ChrononTemplate -B /tmp/chronontemplate-build -G Ninja \
            -DCHRONONTEMPLATE_BUILD_TESTS=ON \
            -DCHRONONTEMPLATE_BUILD_LIVE_ADAPTER_TEST=OFF \
            -DCHRONONTEMPLATE_NLOHMANN_JSON_INCLUDE_DIR=/usr/include \
            -DCHRONONTEMPLATE_CHRONONMOTION_DIR=${{ github.workspace }}/ChrononMotion3D \
            -DCHRONONTEMPLATE_CHRONON3D_DIR=${{ github.workspace }}/Chronon3d

      - name: Build
        run: cmake --build /tmp/chronontemplate-build

      - name: Test
        run: ctest --test-dir /tmp/chronontemplate-build --output-on-failure

      - name: Motion catalog byte-compare (emitter parity)
        run: |
          # emit_catalog reads catalog/motion_catalog.v1.json (data) and is the
          # only writer of catalog/chronontemplate_catalog.v1.json (emitted):
          # parity means the committed emitted file is exactly what the C++
          # packs project today. Any drift fails the build instead of shipping
          # a catalog the renderer would resolve to nothing.
          cmake --build /tmp/chronontemplate-build --target chronontemplate_emit_catalog
          /tmp/chronontemplate-build/chronontemplate_emit_catalog --out /tmp/chronontemplate_catalog.check.json
          cmp /tmp/chronontemplate_catalog.check.json ChrononTemplate/catalog/chronontemplate_catalog.v1.json
          cmake --build /tmp/chronontemplate-build --target chronontemplate_emit_short_phrase_catalog chronontemplate_emit_camera_motion_catalog
          /tmp/chronontemplate-build/chronontemplate_emit_short_phrase_catalog | cmp - ChrononTemplate/catalog/short_phrase_motion.v1.json
          /tmp/chronontemplate-build/chronontemplate_emit_camera_motion_catalog | cmp - ChrononTemplate/catalog/camera_motion_pack.v1.json
