name: Template contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ChrononTemplate
        uses: actions/checkout@v4
        with:
          path: ChrononTemplate
      - name: Check out ChrononMotion3d
        uses: actions/checkout@v4
        with:
          repository: Marcuss-ops/ChrononMotion3d
          ref: 88688d17427efa2d003e26ebfda94a6ec896fc3a
          token: ${{ secrets.CHRONON_PRIVATE_REPO_READ_TOKEN }}
          path: ChrononMotion3d
      - name: Check out Chronon3d RenderPlan headers
        uses: actions/checkout@v4
        with:
          repository: Marcuss-ops/Chronon3d
          ref: 36a44629c369ac13e4befe5e29b93e762fda7e09
          token: ${{ secrets.CHRONON_PRIVATE_REPO_READ_TOKEN }}
          path: Chronon3d
      - name: Verify same-SHA dependency checkouts
        env:
          EXPECTED_MOTION_SHA: 88688d17427efa2d003e26ebfda94a6ec896fc3a
          EXPECTED_CHRONON3D_SHA: 36a44629c369ac13e4befe5e29b93e762fda7e09
        run: |
          test "$(git -C ChrononTemplate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ChrononMotion3d rev-parse HEAD)" = "$EXPECTED_MOTION_SHA"
          test "$(git -C Chronon3d rev-parse HEAD)" = "$EXPECTED_CHRONON3D_SHA"
      - name: Install JSON headers
        run: sudo apt-get update && sudo apt-get install --yes nlohmann-json3-dev libglm-dev ninja-build
      - name: Configure release with warnings as errors
        run: >-
          cmake -S ChrononTemplate -B build/template-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCHRONONTEMPLATE_BUILD_TESTS=ON
          -DCHRONONTEMPLATE_WERROR=ON
          -DCHRONONMOTION_WERROR=OFF
          -DCHRONONTEMPLATE_CHRONONMOTION_DIR=${{ github.workspace }}/ChrononMotion3d
          -DCHRONONTEMPLATE_NLOHMANN_JSON_INCLUDE_DIR=/usr/include
          -DCHRONON3D_INCLUDE_DIR=${{ github.workspace }}/Chronon3d/include
          -DCHRONON3D_DEPENDENCY_INCLUDE_DIR=/usr/include
      - name: Build
        run: cmake --build build/template-ci --parallel 2
      - name: Test
        run: ctest --test-dir build/template-ci --output-on-failure
